services:
  cbvem-dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cbvem_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

  # Static build for ROOT hosting (S3 / CloudFront / custom domain). No basePath.
  cbvem-build:
    build:
      context: .
      target: deps
    volumes:
      - .:/app
      - cbvem_node_modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "rm -rf /app/out /app/dist
      && npm run build
      && rm -rf /app/dist
      && cp -r /app/out /app/dist"

  # Static build for GITHUB PAGES (served under /<repo>/).
  # Set the repo name via BASE_PATH (default /cbvem). Adds .nojekyll so GitHub
  # does not strip the _next/ folder. Output goes to ./docs (GitHub Pages can
  # serve directly from the main branch /docs folder).
  cbvem-pages:
    build:
      context: .
      target: deps
    volumes:
      - .:/app
      - cbvem_node_modules:/app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=${BASE_PATH:-/cbvem}
    command: >
      sh -c "rm -rf /app/out /app/docs
      && npm run build
      && rm -rf /app/docs
      && cp -r /app/out /app/docs
      && touch /app/docs/.nojekyll
      && echo PAGES_BUILD_OK basePath=$$NEXT_PUBLIC_BASE_PATH"

volumes:
  cbvem_node_modules:
